name: Update Market Prices

on:
  schedule:
    # Run every 10 minutes (Mon-Fri active market trading)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/update_market_prices.yml'

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Live Market Prices (Crude, Gold COMEX, Gold India, USD/INR)
        run: node scripts/fetch_market_prices.js

      - name: Commit and Push Updated Prices
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_prices.json
          git diff --staged --quiet || (git commit -m "Auto-update market prices (Crude, Gold, USD/INR) [skip ci]" && git push)
